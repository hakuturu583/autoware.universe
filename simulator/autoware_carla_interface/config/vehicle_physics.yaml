# Vehicle physics applied to the ego actor after it spawns.
#
# CARLA 0.10 ships the same placeholder physics for every car: 70 deg of steer on
# the front wheels, a corrupt steering_curve whose points are unsorted and
# duplicated ([(0, 1.0), (10, 0.5), (0, 1.0), ...]), wheels that report no
# position, and one cornering stiffness for the whole fleet. The car a scenario
# drives therefore does not move like the vehicle Autoware plans for. The
# defaults here are the Lincoln MKZ that `sample_vehicle_description` models
# (wheel_base 2.79 m, wheel_radius 0.383 m, max_steer_angle 0.70 rad).
#
# Two kinds of keys:
#
# * `steer_normalization_deg` is read by the interface, not written to CARLA. It
#   is the wheel angle the server actually reaches at VehicleControl.steer = 1.0,
#   which is what a commanded tire angle has to be divided by. It is NOT the
#   vehicle's modelled max_steer_angle: CARLA 0.10 reports 70 deg for every car
#   and ignores writes to it, while the wheels reach ~45.5 deg (measured from the
#   yaw rate at full steer). Getting this wrong is understeer -- the ego runs wide
#   through curves by metres.
# * every other key is written onto carla.VehiclePhysicsControl, `wheels` onto
#   carla.WheelPhysicsControl (front/rear select the steered and the fixed axles),
#   and steering_curve takes [speed, factor] pairs.
#
# Only the keys present here are written; everything else the server reports is
# left untouched. Point the `vehicle_physics_config` launch argument at another
# file, or set it empty, to change or skip this.

default:
  # Lincoln MKZ, matching sample_vehicle_description.
  steer_normalization_deg: 45.5
  mass: 1750.0 # [kg]
  steering_curve: # flat: the speed-based attenuation CARLA 0.10 ships is corrupt
    - [0.0, 1.0]
    - [120.0, 1.0]
  wheels:
    front:
      wheel_radius: 38.3 # [cm] = 0.383 m
    rear:
      wheel_radius: 38.3 # [cm]

# Per-blueprint overrides, merged over `default`.
vehicles:
  # BYD J6 gen2: a 7.26 x 2.47 x 3.07 m chassis, not the car `default` models.
  #
  # Measured on CARLA 0.10 by holding a fixed VehicleControl.steer at 2 m/s and
  # reading the curvature off the transforms (yaw change per arc length, the one
  # ego reading 0.10 reports reliably):
  #
  #   steer  0.15   0.30   0.50   -0.30
  #   kappa  .00262 .01064 .03007 .01069  [1/m]
  #
  # kappa goes as steer squared, not as steer: reading those back through
  # `tyre angle = steer**2 * max_steer` gives one wheel base (5.49 / 5.42 / 5.37 /
  # 5.39 m, and 5.4 m matches the chassis length), while the proportional law the
  # interface assumes by default spreads it over 36.7 - 11.0 m. So the fraction to
  # send is the square ROOT of the normalized angle; steer_response_exponent says
  # so, and the interface inverts it (see carla_ros.py _invert_steer_response).
  #
  # The 5.4 m wheel base is what Autoware has to plan with as well - see the
  # byd_j6gen2_description vehicle model. Planning with sample_vehicle's 2.79 m
  # here costs another factor of ~1.9 in curvature.
  # steer_response_linear_below_deg is what keeps the loop stable. The exact
  # inverse of a squared response is a square root, whose slope at zero is
  # infinite: around straight ahead the tiniest change in the commanded angle
  # swings the steer fraction, and the lateral loop oscillates (observed as the
  # ego shaking itself off the road). Below this angle the inverse is a straight
  # line meeting the curve at the blend point, which caps the gain near zero at
  # 6.7 per rad (2.3x the plain proportional map with a 20 deg normalization,
  # which did not oscillate), while every angle above it gets the response it
  # asked for. The blend sits below the corner angles that matter: the
  # proportional map crosses from under- to over-steer at 10.9 deg, and the
  # jump to over-steer past that point is what pulls the ego into the curve.
  # Measured on the Odaiba outbound corner: 8 deg left the road at y=42309,
  # 4 deg carried it 21 m further to y=42331 with the peak steer command
  # dropping from 16.0 to 11.8 deg, so the blend is being taken down again.
  vehicle.byd.j6gen2:
    steer_response_exponent: 2.0
    steer_normalization_deg: 36.67 # reached at steer = 1.0 under the squared law
    steer_response_linear_below_deg: 4.0

  vehicle.mini.cooper:
    mass: 1250.0 # [kg]
    wheels:
      front:
        wheel_radius: 31.0 # [cm]
      rear:
        wheel_radius: 31.0 # [cm]
